name: Model test

# workflow_dispatch is the intended trigger. GitHub only registers a dispatch workflow that
# exists on the default branch, and this one lives on ci/model-test alone, so a push of
# acceptance/run-request.env to ci/model-test carries the same four inputs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Fork ref (branch or sha) under test
        required: true
      item:
        description: Acceptance item (acceptance/<item>.sh)
        required: true
        default: vmlx-385
      only:
        description: Comma list of cell ids to run (default all)
        required: false
        default: all
      probe_patch:
        description: Optional patch file under acceptance/ applied to src/ before install
        required: false
        default: ""
  push:
    branches: [ci/model-test]
    paths: [acceptance/run-request.env]

permissions:
  contents: read

jobs:
  model-test:
    runs-on: macos-15
    timeout-minutes: 170
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve request
        env:
          IN_REF: ${{ inputs.ref }}
          IN_ITEM: ${{ inputs.item }}
          IN_ONLY: ${{ inputs.only }}
          IN_PROBE: ${{ inputs.probe_patch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            { echo "REQ_REF=$IN_REF"; echo "REQ_ITEM=$IN_ITEM"; echo "REQ_ONLY=$IN_ONLY"; echo "REQ_PROBE=$IN_PROBE"; } >> "$GITHUB_ENV"
          else
            grep -E '^(REF|ITEM|ONLY|PROBE)=[A-Za-z0-9_./,:-]*$' acceptance/run-request.env | sed 's/^/REQ_/' >> "$GITHUB_ENV"
          fi
          grep '^REQ_' "$GITHUB_ENV"
      - name: Checkout ref under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REQ_REF }}
          path: src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply probe patch
        if: ${{ env.REQ_PROBE != '' }}
        run: git -C src apply --verbose "$GITHUB_WORKSPACE/acceptance/$REQ_PROBE"
      - name: Install package under test and mlx-lm 0.31.3
        run: |
          python -m pip install --disable-pip-version-check ./src 'mlx-lm==0.31.3'
          python -m pip list 2>/dev/null | grep -i -E '^(vmlx|mlx|mlx-lm|transformers|huggingface-hub) ' || true
          git -C src rev-parse HEAD
      - name: Prefetch model
        run: python -c "from huggingface_hub import snapshot_download; print(snapshot_download('mlx-community/Qwen3-0.6B-4bit'))"
      - name: Metal check
        run: python -c "import mlx.core as mx; print('default device', mx.default_device()); print(mx.metal.is_available())"
      - name: Run acceptance script
        id: accept
        env:
          ONLY: ${{ env.REQ_ONLY }}
          WORK_ROOT: ${{ github.workspace }}/work
        run: |
          mkdir -p "$WORK_ROOT"
          rc=0
          bash "acceptance/${REQ_ITEM}.sh" > run.log 2>&1 || rc=$?
          echo "acceptance rc=$rc" | tee -a run.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Print result rows
        if: always()
        run: grep -E '^(ENV|SERVER|LOGCTX|RESULT|BODY|SUMMARY|acceptance rc)' run.log || true
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ env.REQ_ITEM }}
          path: |
            run.log
            work/**
          if-no-files-found: warn
      - name: Fail when the script failed
        if: ${{ steps.accept.outputs.rc != '0' }}
        run: exit 1
